<li class="Movie__Card" onclick="C.handlerMovieDetail('{{id}}')">
  <img class="Movie__Image" src="{{image}}" alt="{{name}}" />
  <h1 class="Movie__Title">{{name}}</h1>
  <button class="Movie__addFavorite" onclick="C.handlerAddFavorite('{{id}}')">
    Ajouter ou retirer des Favoris
  </button>
</li>
